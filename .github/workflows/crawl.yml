name: 공지 크롤링

on:
  schedule:
    # GitHub 스케줄은 UTC 기준이에요. 한국 시간 09:00, 18:00
    - cron: "0 0 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 바로 실행할 수 있어요

permissions:
  contents: write # data/notices.js 를 저장소에 커밋하려면 필요해요

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 공지 가져오기
        run: node crawler/crawl.mjs

      - name: 바뀐 내용 저장
        run: |
          if git diff --quiet -- data/notices.js; then
            echo "바뀐 내용이 없어요"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notices.js
          git commit -m "공지 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
